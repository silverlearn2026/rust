name: Build Custom RustDesk Windows Client

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        default: "master"

      server:
        required: false
        type: string
        default: ""

      key:
        required: false
        type: string
        default: ""

      apiServer:
        required: false
        type: string
        default: ""

      custom:
        required: false
        type: string
        default: ""

      uuid:
        required: false
        type: string
        default: ""

      iconlink:
        required: false
        type: string
        default: ""

      logolink:
        required: false
        type: string
        default: ""

      appname:
        required: false
        type: string
        default: "RustDesk"

      filename:
        required: false
        type: string
        default: "RustDesk.exe"

      extras:
        description: "Complete Laravel appearance/client JSON"
        required: false
        type: string
        default: ""

      upload_artifact:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_TRIPLET: "x64-windows-static"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  FRB_VERSION: "1.80.1"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Laravel builder
        uses: actions/checkout@v4

      - name: Checkout RustDesk master
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ inputs.version }}
          path: rustdesk
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustdesk

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: pwsh
        working-directory: rustdesk
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ env.VCPKG_TRIPLET }}
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --triplet "${{ env.VCPKG_TRIPLET }}" `
            --x-install-root="$env:VCPKG_ROOT\installed"

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg dependencies failed."
          }

      - name: Apply Laravel configuration
        shell: pwsh
        working-directory: rustdesk
        env:
          SERVER: ${{ inputs.server }}
          KEY: ${{ inputs.key }}
          API: ${{ inputs.apiServer }}
          APP: ${{ inputs.appname }}
          FILE: ${{ inputs.filename }}
          EXTRAS: ${{ inputs.extras }}
        run: |
          $script = "..\scripts\apply_config.py"

          if (-not (Test-Path $script)) {
            throw "apply_config.py not found."
          }

          $args = @(
            "--rustdesk", "$PWD"
          )

          if ($env:SERVER) {
            $args += @("--server", $env:SERVER)
          }

          if ($env:KEY) {
            $args += @("--key", $env:KEY)
          }

          if ($env:API) {
            $args += @("--api", $env:API)
          }

          if ($env:APP) {
            $args += @("--appname", $env:APP)
          }

          if ($env:FILE) {
            $args += @("--filename", $env:FILE)
          }

          if ($env:EXTRAS) {
            $args += @("--extras", $env:EXTRAS)
          }

          python $script @args

          if ($LASTEXITCODE -ne 0) {
            throw "Configuration patch failed."
          }

      - name: Verify patched configuration
        shell: pwsh
        working-directory: rustdesk
        run: |
          $required = @(
            ".\flutter\lib\generated_client_config.dart",
            ".\flutter\lib\generated\custom_client_config.dart",
            ".\src\generated_client_config.rs",
            ".\src\custom_server.rs",
            ".\res\custom-client-config.json",
            ".\.cloud-builder.json"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Missing generated configuration file: $file"
            }
          }

          Write-Host "===== GENERATED FLUTTER CONFIG ====="
          Get-Content ".\flutter\lib\generated_client_config.dart"

          Write-Host "===== GENERATED RUST CONFIG ====="
          Get-Content ".\src\generated_client_config.rs"

      - name: Flutter dependencies
        shell: pwsh
        working-directory: rustdesk\flutter
        run: |
          flutter clean

          if ($LASTEXITCODE -ne 0) {
            throw "flutter clean failed."
          }

          flutter pub get

          if ($LASTEXITCODE -ne 0) {
            throw "flutter pub get failed."
          }

      - name: Install Flutter Rust Bridge
        shell: pwsh
        working-directory: rustdesk
        run: |
          cargo install flutter_rust_bridge_codegen `
            --version "${{ env.FRB_VERSION }}" `
            --locked

          if ($LASTEXITCODE -ne 0) {
            throw "FRB installation failed."
          }

      - name: Generate Flutter Rust Bridge
        shell: pwsh
        working-directory: rustdesk
        run: |
          $codegen = "$env:USERPROFILE\.cargo\bin\flutter_rust_bridge_codegen.exe"

          if (-not (Test-Path $codegen)) {
            throw "flutter_rust_bridge_codegen.exe not found."
          }

          & $codegen `
            --rust-input ".\src\flutter_ffi.rs" `
            --dart-output ".\flutter\lib\generated_bridge.dart" `
            --c-output ".\flutter\macos\Runner\bridge_generated.h"

          if ($LASTEXITCODE -ne 0) {
            throw "FRB generation failed."
          }

      - name: Verify FRB generated files
        shell: pwsh
        working-directory: rustdesk
        run: |
          $files = @(
            ".\src\bridge_generated.rs",
            ".\src\bridge_generated.io.rs",
            ".\flutter\lib\generated_bridge.dart"
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Missing FRB generated file: $file"
            }
          }

      - name: Build RustDesk Windows runtime
        shell: pwsh
        working-directory: rustdesk
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
          VCPKG_DEFAULT_TRIPLET: ${{ env.VCPKG_TRIPLET }}
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}
        run: |
          python build.py --portable --flutter --skip-portable-pack --hwcodec

          if ($LASTEXITCODE -ne 0) {
            throw "RustDesk build failed."
          }

      - name: Verify Windows runtime
        shell: pwsh
        working-directory: rustdesk
        run: |
          $release = Join-Path `
            $PWD `
            "flutter\build\windows\x64\runner\Release"

          if (-not (Test-Path $release)) {
            throw "Windows Release directory not found."
          }

          $exe = Join-Path $release "rustdesk.exe"

          if (-not (Test-Path $exe)) {
            throw "rustdesk.exe missing."
          }

          if (-not (Test-Path (Join-Path $release "data"))) {
            throw "Flutter data directory missing."
          }

          Write-Host "Runtime:"
          Get-ChildItem $release

      - name: Verify embedded build configuration
        shell: pwsh
        working-directory: rustdesk
        env:
          EXPECTED_SERVER: ${{ inputs.server }}
          EXPECTED_API: ${{ inputs.apiServer }}
          EXPECTED_APP: ${{ inputs.appname }}
        run: |
          $metadata = Get-Content `
            ".\.cloud-builder.json" `
            -Raw | ConvertFrom-Json

          if ($env:EXPECTED_APP -and `
              $metadata.appname -ne $env:EXPECTED_APP) {
            throw "App name was not embedded into build configuration."
          }

          if ($env:EXPECTED_SERVER -and `
              $metadata.server -ne $env:EXPECTED_SERVER) {
            throw "Server was not embedded into build configuration."
          }

          if ($env:EXPECTED_API -and `
              $metadata.api -ne $env:EXPECTED_API) {
            throw "API server was not embedded into build configuration."
          }

          Write-Host "Build configuration verification passed."

      - name: Build single-file portable EXE
        shell: pwsh
        working-directory: rustdesk
        env:
          OUTPUT: ${{ inputs.filename }}
        run: |
          $portable = Join-Path $PWD "libs\portable"
          $release = Join-Path `
            $PWD `
            "flutter\build\windows\x64\runner\Release"

          $packer = Join-Path `
            $PWD `
            "target\release\rustdesk-portable-packer.exe"

          if (Test-Path $packer) {
            Remove-Item $packer -Force
          }

          Push-Location $portable

          try {
            python -m pip install -r requirements.txt

            if ($LASTEXITCODE -ne 0) {
              throw "Portable packer dependencies failed."
            }

            python .\generate.py `
              -f "$release" `
              -o "." `
              -e "$release\rustdesk.exe"

            if ($LASTEXITCODE -ne 0) {
              throw "Portable packer failed."
            }
          }
          finally {
            Pop-Location
          }

          if (-not (Test-Path $packer)) {
            throw "Portable EXE was not created."
          }

          $name = $env:OUTPUT

          if (-not $name) {
            $name = "RustDesk.exe"
          }

          if (-not $name.EndsWith(
              ".exe",
              [System.StringComparison]::OrdinalIgnoreCase
            )) {
            $name += ".exe"
          }

          $output = Join-Path $PWD "Release"

          if (Test-Path $output) {
            Remove-Item $output -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $output | Out-Null

          Copy-Item `
            $packer `
            (Join-Path $output $name) `
            -Force

          $final = Join-Path $output $name

          if (-not (Test-Path $final)) {
            throw "Final EXE missing."
          }

          Write-Host "======================================"
          Write-Host "FINAL EXE"
          Write-Host $final
          Write-Host "======================================"

      - name: Upload Windows client
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64-${{ github.run_number }}
          path: rustdesk/Release/*.exe
          if-no-files-found: error
          retention-days: 7
