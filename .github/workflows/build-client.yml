name: Build Custom RustDesk Windows Client

on:
  workflow_dispatch:
    inputs:
      version:
        description: "RustDesk tag / branch / commit"
        required: true
        type: string
        default: "master"

      server:
        description: "Rendezvous / ID server"
        required: false
        type: string
        default: ""

      key:
        description: "RustDesk public key"
        required: false
        type: string
        default: ""

      apiServer:
        description: "API server"
        required: false
        type: string
        default: ""

      custom:
        description: "Base64 encoded custom configuration"
        required: false
        type: string
        default: ""

      upload_artifact:
        description: "Upload build artifact"
        required: false
        type: boolean
        default: true


permissions:
  contents: read


env:
  # RustDesk build versions
  FLUTTER_VERSION: "3.24.5"

  # Rust version compatible with the RustDesk source
  RUST_VERSION: "stable"

  # Official RustDesk vcpkg baseline currently used by their CI
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

  # Enable GitHub Actions vcpkg binary cache
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

  # Build target
  VCPKG_TRIPLET: "x64-windows-static"

  # RustDesk features
  RUSTDESK_FEATURES: "flutter,hwcodec"


jobs:

  build:

    name: Build RustDesk Windows x64

    runs-on: windows-2022

    steps:

      # ------------------------------------------------------------
      # 1. Checkout builder repository
      # ------------------------------------------------------------

      - name: Checkout builder repository
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. Checkout RustDesk source
      # ------------------------------------------------------------

      - name: Checkout RustDesk
        uses: actions/checkout@v4

        with:
          repository: rustdesk/rustdesk
          ref: ${{ inputs.version }}
          path: rustdesk
          submodules: recursive


      # ------------------------------------------------------------
      # 3. Show selected version
      # ------------------------------------------------------------

      - name: Show build information
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "RustDesk Custom Client Build"
          Write-Host "=========================================="
          Write-Host "RustDesk version: ${{ inputs.version }}"
          Write-Host "Server:           ${{ inputs.server }}"
          Write-Host "API Server:       ${{ inputs.apiServer }}"
          Write-Host "VCPKG triplet:    $env:VCPKG_TRIPLET"
          Write-Host "=========================================="


      # ------------------------------------------------------------
      # 4. Setup Python
      # ------------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ------------------------------------------------------------
      # 5. Setup Flutter
      # ------------------------------------------------------------

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true


      # ------------------------------------------------------------
      # 6. Flutter information
      # ------------------------------------------------------------

      - name: Verify Flutter
        shell: pwsh
        run: |
          flutter --version
          dart --version
          flutter doctor -v


      # ------------------------------------------------------------
      # 7. Setup Rust
      # ------------------------------------------------------------

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc


      # ------------------------------------------------------------
      # 8. Rust information
      # ------------------------------------------------------------

      - name: Verify Rust
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          rustup show


      # ------------------------------------------------------------
      # 9. Rust cache
      # ------------------------------------------------------------

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

        with:
          workspaces: |
            rustdesk


      # ------------------------------------------------------------
      # 10. Setup vcpkg
      #
      # IMPORTANT:
      # RustDesk hwcodec expects VCPKG_ROOT.
      # ------------------------------------------------------------

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

        with:
          vcpkgDirectory: C:\vcpkg

          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

          doNotCache: false


      # ------------------------------------------------------------
      # 11. Verify vcpkg
      # ------------------------------------------------------------

      - name: Verify vcpkg
        shell: pwsh
        run: |
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"

          if (-not $env:VCPKG_ROOT) {
            throw "VCPKG_ROOT is not set."
          }

          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            throw "vcpkg.exe was not found."
          }

          & "$env:VCPKG_ROOT\vcpkg.exe" version


      # ------------------------------------------------------------
      # 12. Install RustDesk vcpkg dependencies
      #
      # RustDesk officially installs dependencies through
      # the project's vcpkg.json manifest.
      # ------------------------------------------------------------

      - name: Install vcpkg dependencies
        shell: pwsh
        working-directory: rustdesk

        env:
          VCPKG_DEFAULT_TRIPLET: ${{ env.VCPKG_TRIPLET }}
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}

        run: |

          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET"

          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --triplet "${{ env.VCPKG_TRIPLET }}" `
            --x-install-root="$env:VCPKG_ROOT\installed"

          if ($LASTEXITCODE -ne 0) {

            Write-Host ""
            Write-Host "=========================================="
            Write-Host "vcpkg installation failed"
            Write-Host "=========================================="

            Get-ChildItem `
              "$env:VCPKG_ROOT" `
              -Recurse `
              -Filter "*.log" `
              -ErrorAction SilentlyContinue |
              ForEach-Object {

                Write-Host ""
                Write-Host "LOG: $($_.FullName)"
                Write-Host "------------------------------------------"

                Get-Content $_.FullName -Tail 200
              }

            exit $LASTEXITCODE
          }


      # ------------------------------------------------------------
      # 13. Verify installed vcpkg libraries
      # ------------------------------------------------------------

      - name: Verify vcpkg libraries
        shell: pwsh
        run: |

          Write-Host "Checking vcpkg installation..."

          $tripletPath = "$env:VCPKG_ROOT\installed\${{ env.VCPKG_TRIPLET }}"

          if (-not (Test-Path $tripletPath)) {
            throw "vcpkg triplet installation directory not found: $tripletPath"
          }

          Write-Host ""
          Write-Host "Installed libraries:"
          Write-Host "------------------------------------------"

          Get-ChildItem "$tripletPath\lib" -ErrorAction SilentlyContinue |
            Select-Object Name |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Installed packages:"
          Write-Host "------------------------------------------"

          & "$env:VCPKG_ROOT\vcpkg.exe" list


      # ------------------------------------------------------------
      # 14. Prepare RustDesk configuration
      #
      # The values are passed as environment variables so the
      # configuration script can consume them.
      # ------------------------------------------------------------

      - name: Prepare custom configuration
        shell: pwsh
        working-directory: rustdesk

        env:
          RUSTDESK_SERVER: ${{ inputs.server }}
          RUSTDESK_KEY: ${{ inputs.key }}
          RUSTDESK_API_SERVER: ${{ inputs.apiServer }}
          RUSTDESK_CUSTOM: ${{ inputs.custom }}

        run: |

          Write-Host "Preparing RustDesk configuration..."

          $configDir = ".\res"

          if (-not (Test-Path $configDir)) {
            New-Item -ItemType Directory -Force $configDir | Out-Null
          }

          # Save builder metadata.
          #
          # This file is intentionally simple and can be consumed
          # by apply_config.py later.

          @"
          {
            "server": "$($env:RUSTDESK_SERVER)",
            "key": "$($env:RUSTDESK_KEY)",
            "apiServer": "$($env:RUSTDESK_API_SERVER)"
          }
          "@ | Set-Content `
              -Path ".\res\builder-config.json" `
              -Encoding UTF8

          # If Laravel supplied a Base64 configuration,
          # decode it into custom_.txt.

          if ($env:RUSTDESK_CUSTOM) {

            try {

              $bytes = [System.Convert]::FromBase64String(
                $env:RUSTDESK_CUSTOM
              )

              [System.IO.File]::WriteAllBytes(
                "$PWD\res\custom_.txt",
                $bytes
              )

              Write-Host "custom_.txt created successfully."

            }
            catch {

              Write-Warning "custom input is not valid Base64."
              Write-Warning $_
            }

          }
          else {

            Write-Host "No custom Base64 configuration supplied."

          }


      # ------------------------------------------------------------
      # 15. Apply custom configuration if script exists
      #
      # This prevents the workflow from failing just because
      # apply_config.py is not present.
      # ------------------------------------------------------------

      - name: Apply custom configuration
        shell: pwsh
        working-directory: rustdesk

        env:
          RUSTDESK_SERVER: ${{ inputs.server }}
          RUSTDESK_KEY: ${{ inputs.key }}
          RUSTDESK_API_SERVER: ${{ inputs.apiServer }}

        run: |

          if (Test-Path ".\..\scripts\apply_config.py") {

            Write-Host "Found builder configuration script."

            python ..\scripts\apply_config.py

          }
          else {

            Write-Host ""
            Write-Host "=========================================="
            Write-Host "apply_config.py not found."
            Write-Host "Skipping Python configuration patch."
            Write-Host "=========================================="
            Write-Host ""

          }


      # ------------------------------------------------------------
      # 16. Show final RustDesk configuration files
      # ------------------------------------------------------------

      - name: Inspect configuration
        shell: pwsh
        working-directory: rustdesk

        run: |

          Write-Host "RustDesk configuration files:"
          Write-Host "=========================================="

          if (Test-Path ".\res\builder-config.json") {

            Get-Content ".\res\builder-config.json"
          }

          if (Test-Path ".\res\custom_.txt") {

            Write-Host ""
            Write-Host "custom_.txt exists."

            $size = (Get-Item ".\res\custom_.txt").Length

            Write-Host "custom_.txt size: $size bytes"
          }


      # ------------------------------------------------------------
      # 17. Flutter dependencies
      # ------------------------------------------------------------

      - name: Flutter pub get
        shell: pwsh
        working-directory: rustdesk\flutter

        run: |

          flutter clean

          flutter pub get


      # ------------------------------------------------------------
      # 18. Verify C++ build environment
      # ------------------------------------------------------------

      - name: Verify MSVC
        shell: pwsh
        run: |

          Write-Host "Searching for Visual Studio..."

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (Test-Path $vswhere) {

            & $vswhere `
              -latest `
              -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath

          }
          else {

            Write-Warning "vswhere.exe not found."

          }


      # ------------------------------------------------------------
      # 19. Build RustDesk
      #
      # IMPORTANT:
      # VCPKG_ROOT is explicitly passed to the build environment.
      # ------------------------------------------------------------

      - name: Build RustDesk
        id: build
        shell: pwsh
        working-directory: rustdesk

        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
          VCPKG_DEFAULT_TRIPLET: ${{ env.VCPKG_TRIPLET }}
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}

        run: |

          Write-Host "=========================================="
          Write-Host "Building RustDesk"
          Write-Host "=========================================="

          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET"

          Write-Host ""
          Write-Host "Rust:"
          rustc --version
          cargo --version

          Write-Host ""
          Write-Host "Flutter:"
          flutter --version

          Write-Host ""
          Write-Host "Python:"
          python --version

          Write-Host ""
          Write-Host "Starting build..."

          python build.py `
            --portable `
            --flutter `
            --skip-portable-pack `
            --hwcodec

          if ($LASTEXITCODE -ne 0) {

            Write-Host ""
            Write-Host "=========================================="
            Write-Host "RustDesk BUILD FAILED"
            Write-Host "=========================================="

            exit $LASTEXITCODE
          }


      # ------------------------------------------------------------
      # 20. Locate generated files
      # ------------------------------------------------------------

      - name: Locate build output
        shell: pwsh
        working-directory: rustdesk

        run: |

          Write-Host "Searching for RustDesk executable..."

          $files = Get-ChildItem `
            -Path "." `
            -Recurse `
            -Include "rustdesk.exe","RustDesk.exe" `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $files) {

            Write-Error "RustDesk executable was not found."

            exit 1
          }

          foreach ($file in $files) {

            Write-Host ""
            Write-Host "FOUND:"
            Write-Host $file.FullName
            Write-Host "SIZE: $($file.Length) bytes"

          }


      # ------------------------------------------------------------
      # 21. Prepare artifact
      # ------------------------------------------------------------

      - name: Prepare artifact
        shell: pwsh
        working-directory: rustdesk

        run: |

          New-Item `
            -ItemType Directory `
            -Force `
            -Path ".\Release" |
            Out-Null

          $exe = Get-ChildItem `
            -Path "." `
            -Recurse `
            -Include "rustdesk.exe","RustDesk.exe" `
            -File `
            | Where-Object {
                $_.FullName -notmatch "\\target\\debug\\"
              } `
            | Select-Object -First 1

          if (-not $exe) {

            throw "RustDesk executable not found."
          }

          Copy-Item `
            $exe.FullName `
            ".\Release\RustDesk.exe" `
            -Force

          Write-Host "Artifact prepared:"
          Get-Item ".\Release\RustDesk.exe" |
            Select-Object Name,Length,FullName


      # ------------------------------------------------------------
      # 22. Create build information
      # ------------------------------------------------------------

      - name: Create build metadata
        shell: pwsh
        working-directory: rustdesk

        run: |

          @"
          RustDesk Custom Client
          ======================

          Version:
          ${{ inputs.version }}

          Server:
          ${{ inputs.server }}

          API Server:
          ${{ inputs.apiServer }}

          Architecture:
          x64

          Flutter:
          ${{ env.FLUTTER_VERSION }}

          VCPKG:
          ${{ env.VCPKG_COMMIT_ID }}

          Build:
          GitHub Actions

          "@ | Set-Content `
              ".\Release\build-info.txt" `
              -Encoding UTF8


      # ------------------------------------------------------------
      # 23. Upload artifact
      # ------------------------------------------------------------

      - name: Upload Windows client
        if: ${{ inputs.upload_artifact }}

        uses: actions/upload-artifact@v4

        with:
          name: rustdesk-windows-x64-${{ github.run_number }}

          path: |
            rustdesk/Release/RustDesk.exe
            rustdesk/Release/build-info.txt

          if-no-files-found: error

          retention-days: 7


      # ------------------------------------------------------------
      # 24. Build summary
      # ------------------------------------------------------------

      - name: Build summary
        if: always()
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "BUILD SUMMARY"
          Write-Host "=========================================="

          Write-Host "RustDesk version : ${{ inputs.version }}"
          Write-Host "Architecture     : x64"
          Write-Host "Flutter          : ${{ env.FLUTTER_VERSION }}"
          Write-Host "VCPKG            : ${{ env.VCPKG_COMMIT_ID }}"
          Write-Host "Result           : ${{ job.status }}"

          Write-Host "=========================================="
