name: Build Custom RustDesk Windows Client

on:
  workflow_dispatch:
    inputs:

      version:
        description: "RustDesk tag / branch / commit"
        required: true
        type: string
        default: "master"

      server:
        description: "Rendezvous / ID server"
        required: false
        type: string
        default: ""

      key:
        description: "RustDesk public key"
        required: false
        type: string
        default: ""

      apiServer:
        description: "RustDesk API server"
        required: false
        type: string
        default: ""

      custom:
        description: "Base64 encoded RustDesk custom configuration"
        required: false
        type: string
        default: ""

      uuid:
        description: "Client UUID"
        required: false
        type: string
        default: ""

      iconlink:
        description: "Client icon URL"
        required: false
        type: string
        default: ""

      logolink:
        description: "Client logo URL"
        required: false
        type: string
        default: ""

      appname:
        description: "Application name"
        required: false
        type: string
        default: "RustDesk"

      filename:
        description: "Output executable filename"
        required: false
        type: string
        default: "RustDesk.exe"

      extras:
        description: "Additional client configuration"
        required: false
        type: string
        default: ""

      upload_artifact:
        description: "Upload generated Windows client"
        required: false
        type: boolean
        default: true


permissions:
  contents: read


env:

  # ------------------------------------------------------------
  # RustDesk / build versions
  # ------------------------------------------------------------

  FLUTTER_VERSION: "3.24.5"

  RUST_VERSION: "stable"

  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

  VCPKG_TRIPLET: "x64-windows-static"

  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"


jobs:

  build:

    name: Build RustDesk Windows x64

    runs-on: windows-2022

    steps:

      # ==========================================================
      # 1. Checkout builder repository
      # ==========================================================

      - name: Checkout builder repository

        uses: actions/checkout@v4


      # ==========================================================
      # 2. Checkout RustDesk
      # ==========================================================

      - name: Checkout RustDesk

        uses: actions/checkout@v4

        with:
          repository: rustdesk/rustdesk
          ref: ${{ inputs.version }}
          path: rustdesk
          submodules: recursive


      # ==========================================================
      # 3. Display build information
      # ==========================================================

      - name: Display build information

        shell: pwsh

        run: |

          Write-Host "=============================================="
          Write-Host "       RustDesk Custom Windows Builder"
          Write-Host "=============================================="

          Write-Host "RustDesk version : ${{ inputs.version }}"
          Write-Host "Application      : ${{ inputs.appname }}"
          Write-Host "Filename         : ${{ inputs.filename }}"
          Write-Host "UUID             : ${{ inputs.uuid }}"
          Write-Host "Server           : ${{ inputs.server }}"
          Write-Host "API Server       : ${{ inputs.apiServer }}"
          Write-Host "Icon URL         : ${{ inputs.iconlink }}"
          Write-Host "Logo URL         : ${{ inputs.logolink }}"

          Write-Host "=============================================="


      # ==========================================================
      # 4. Setup Python
      # ==========================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ==========================================================
      # 5. Setup Flutter
      # ==========================================================

      - name: Setup Flutter

        uses: subosito/flutter-action@v2

        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true


      # ==========================================================
      # 6. Verify Flutter
      # ==========================================================

      - name: Verify Flutter

        shell: pwsh

        run: |

          Write-Host "Flutter:"
          flutter --version

          Write-Host ""
          Write-Host "Dart:"
          dart --version

          Write-Host ""
          Write-Host "Flutter Doctor:"
          flutter doctor -v


      # ==========================================================
      # 7. Setup Rust
      # ==========================================================

      - name: Setup Rust

        uses: dtolnay/rust-toolchain@stable

        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc


      # ==========================================================
      # 8. Verify Rust
      # ==========================================================

      - name: Verify Rust

        shell: pwsh

        run: |

          rustc --version
          cargo --version
          rustup show


      # ==========================================================
      # 9. Rust cache
      # ==========================================================

      - name: Rust cache

        uses: Swatinem/rust-cache@v2

        with:
          workspaces: |
            rustdesk


      # ==========================================================
      # 10. Setup vcpkg
      # ==========================================================

      - name: Setup vcpkg

        uses: lukka/run-vcpkg@v11

        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false


      # ==========================================================
      # 11. Verify vcpkg
      # ==========================================================

      - name: Verify vcpkg

        shell: pwsh

        run: |

          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"

          if (-not $env:VCPKG_ROOT) {
            throw "VCPKG_ROOT is not set."
          }

          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            throw "vcpkg.exe not found."
          }

          & "$env:VCPKG_ROOT\vcpkg.exe" version


      # ==========================================================
      # 12. Install vcpkg dependencies
      # ==========================================================

      - name: Install vcpkg dependencies

        shell: pwsh

        working-directory: rustdesk

        env:

          VCPKG_DEFAULT_TRIPLET: ${{ env.VCPKG_TRIPLET }}

          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}

        run: |

          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "Triplet=$env:VCPKG_DEFAULT_TRIPLET"

          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --triplet "${{ env.VCPKG_TRIPLET }}" `
            --x-install-root="$env:VCPKG_ROOT\installed"

          if ($LASTEXITCODE -ne 0) {

            Write-Host "vcpkg installation failed."

            exit $LASTEXITCODE
          }


      # ==========================================================
      # 13. Verify vcpkg packages
      # ==========================================================

      - name: Verify vcpkg packages

        shell: pwsh

        run: |

          Write-Host "Installed vcpkg packages:"

          & "$env:VCPKG_ROOT\vcpkg.exe" list


      # ==========================================================
      # 14. Create builder configuration
      # ==========================================================

      - name: Create builder configuration

        shell: pwsh

        working-directory: rustdesk

        env:

          CLIENT_SERVER: ${{ inputs.server }}

          CLIENT_KEY: ${{ inputs.key }}

          CLIENT_API_SERVER: ${{ inputs.apiServer }}

          CLIENT_UUID: ${{ inputs.uuid }}

          CLIENT_ICON: ${{ inputs.iconlink }}

          CLIENT_LOGO: ${{ inputs.logolink }}

          CLIENT_APPNAME: ${{ inputs.appname }}

          CLIENT_FILENAME: ${{ inputs.filename }}

          CLIENT_EXTRAS: ${{ inputs.extras }}

        run: |

          New-Item `
            -ItemType Directory `
            -Force `
            -Path ".\res" |
            Out-Null


          @"
          {
            "uuid": "$env:CLIENT_UUID",
            "server": "$env:CLIENT_SERVER",
            "key": "$env:CLIENT_KEY",
            "apiServer": "$env:CLIENT_API_SERVER",
            "iconlink": "$env:CLIENT_ICON",
            "logolink": "$env:CLIENT_LOGO",
            "appname": "$env:CLIENT_APPNAME",
            "filename": "$env:CLIENT_FILENAME",
            "extras": "$env:CLIENT_EXTRAS"
          }
          "@ | Set-Content `
            -Path ".\res\builder-config.json" `
            -Encoding UTF8


          Write-Host "builder-config.json created."


      # ==========================================================
      # 15. Create custom_.txt
      # ==========================================================

      - name: Create custom configuration

        shell: pwsh

        working-directory: rustdesk

        env:

          CUSTOM_CONFIG: ${{ inputs.custom }}

        run: |

          if ($env:CUSTOM_CONFIG) {

            Write-Host "Decoding custom configuration..."

            try {

              $bytes = [Convert]::FromBase64String(
                $env:CUSTOM_CONFIG
              )

              [IO.File]::WriteAllBytes(
                "$PWD\res\custom_.txt",
                $bytes
              )

              Write-Host "custom_.txt created."

            }

            catch {

              Write-Error "Invalid Base64 custom configuration."

              throw
            }

          }

          else {

            Write-Host "No custom configuration supplied."

          }


      # ==========================================================
      # 16. Apply configuration script
      # ==========================================================

      - name: Apply RustDesk configuration

        shell: pwsh

        working-directory: rustdesk

        env:

          RUSTDESK_SERVER: ${{ inputs.server }}

          RUSTDESK_KEY: ${{ inputs.key }}

          RUSTDESK_API_SERVER: ${{ inputs.apiServer }}

          RUSTDESK_UUID: ${{ inputs.uuid }}

          RUSTDESK_ICONLINK: ${{ inputs.iconlink }}

          RUSTDESK_LOGOLINK: ${{ inputs.logolink }}

          RUSTDESK_APPNAME: ${{ inputs.appname }}

          RUSTDESK_FILENAME: ${{ inputs.filename }}

          RUSTDESK_EXTRAS: ${{ inputs.extras }}

        run: |

          $script = "..\scripts\apply_config.py"

          if (Test-Path $script) {

            Write-Host "Running apply_config.py..."

            python $script

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

          }

          else {

            Write-Warning "scripts/apply_config.py was not found."

            Write-Warning "Skipping configuration patch."

          }


      # ==========================================================
      # 17. Inspect configuration
      # ==========================================================

      - name: Inspect configuration

        shell: pwsh

        working-directory: rustdesk

        run: |

          Write-Host "=============================================="
          Write-Host "Configuration files"
          Write-Host "=============================================="


          if (Test-Path ".\res\builder-config.json") {

            Get-Content ".\res\builder-config.json"
          }


          if (Test-Path ".\res\custom_.txt") {

            Write-Host ""
            Write-Host "custom_.txt exists."

            $size = (
              Get-Item ".\res\custom_.txt"
            ).Length

            Write-Host "Size: $size bytes"
          }


      # ==========================================================
      # 18. Flutter dependencies
      # ==========================================================

      - name: Flutter pub get

        shell: pwsh

        working-directory: rustdesk\flutter

        run: |

          flutter clean

          flutter pub get


      # ==========================================================
      # 19. Build RustDesk
      # ==========================================================

      - name: Build RustDesk

        id: build

        shell: pwsh

        working-directory: rustdesk

        env:

          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}

          VCPKG_DEFAULT_TRIPLET: ${{ env.VCPKG_TRIPLET }}

          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}

        run: |

          Write-Host "=============================================="
          Write-Host "Building RustDesk"
          Write-Host "=============================================="

          Write-Host ""
          Write-Host "VCPKG_ROOT:"
          Write-Host $env:VCPKG_ROOT

          Write-Host ""
          Write-Host "VCPKG Triplet:"
          Write-Host $env:VCPKG_DEFAULT_TRIPLET

          Write-Host ""
          Write-Host "Rust:"
          rustc --version
          cargo --version

          Write-Host ""
          Write-Host "Flutter:"
          flutter --version

          Write-Host ""
          Write-Host "Python:"
          python --version

          Write-Host ""
          Write-Host "Starting RustDesk build..."


          python build.py `
            --portable `
            --flutter `
            --skip-portable-pack `
            --hwcodec


          if ($LASTEXITCODE -ne 0) {

            Write-Host ""
            Write-Host "=============================================="
            Write-Host "RUSTDESK BUILD FAILED"
            Write-Host "=============================================="

            exit $LASTEXITCODE
          }


      # ==========================================================
      # 20. Find generated EXE
      # ==========================================================

      - name: Find generated executable

        shell: pwsh

        working-directory: rustdesk

        run: |

          Write-Host "Searching for RustDesk executable..."

          $files = Get-ChildItem `
            -Path "." `
            -Recurse `
            -Include "rustdesk.exe","RustDesk.exe" `
            -File `
            -ErrorAction SilentlyContinue


          if (-not $files) {

            Write-Error "RustDesk executable was not found."

            exit 1
          }


          foreach ($file in $files) {

            Write-Host ""
            Write-Host "FOUND:"
            Write-Host $file.FullName

            Write-Host "SIZE:"
            Write-Host "$($file.Length) bytes"
          }


      # ==========================================================
      # 21. Prepare Release
      # ==========================================================

      - name: Prepare Release

        shell: pwsh

        working-directory: rustdesk

        env:

          OUTPUT_FILENAME: ${{ inputs.filename }}

        run: |

          New-Item `
            -ItemType Directory `
            -Force `
            -Path ".\Release" |
            Out-Null


          $exe = Get-ChildItem `
            -Path "." `
            -Recurse `
            -Include "rustdesk.exe","RustDesk.exe" `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch "\\target\\debug\\"
            } |
            Select-Object -First 1


          if (-not $exe) {

            throw "RustDesk executable not found."
          }


          $outputName = $env:OUTPUT_FILENAME

          if (-not $outputName) {
            $outputName = "RustDesk.exe"
          }


          if (-not $outputName.EndsWith(".exe")) {
            $outputName += ".exe"
          }


          Copy-Item `
            $exe.FullName `
            ".\Release\$outputName" `
            -Force


          Write-Host ""
          Write-Host "Final executable:"
          Write-Host ".\Release\$outputName"


      # ==========================================================
      # 22. Build metadata
      # ==========================================================

      - name: Create build metadata

        shell: pwsh

        working-directory: rustdesk

        run: |

          @"
          RustDesk Custom Windows Client
          ==================================

          Version:
          ${{ inputs.version }}

          Application:
          ${{ inputs.appname }}

          Filename:
          ${{ inputs.filename }}

          UUID:
          ${{ inputs.uuid }}

          Server:
          ${{ inputs.server }}

          API Server:
          ${{ inputs.apiServer }}

          Architecture:
          x64

          Flutter:
          ${{ env.FLUTTER_VERSION }}

          VCPKG:
          ${{ env.VCPKG_COMMIT_ID }}

          GitHub Run:
          ${{ github.run_number }}

          "@ | Set-Content `
            ".\Release\build-info.txt" `
            -Encoding UTF8


      # ==========================================================
      # 23. Upload artifact
      # ==========================================================

      - name: Upload Windows client

        if: ${{ inputs.upload_artifact }}

        uses: actions/upload-artifact@v4

        with:

          name: rustdesk-windows-x64-${{ github.run_number }}

          path: |
            rustdesk/Release/*.exe
            rustdesk/Release/build-info.txt

          if-no-files-found: error

          retention-days: 7


      # ==========================================================
      # 24. Summary
      # ==========================================================

      - name: Build summary

        if: always()

        shell: pwsh

        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "BUILD SUMMARY"
          Write-Host "=============================================="

          Write-Host "Status       : ${{ job.status }}"
          Write-Host "Version      : ${{ inputs.version }}"
          Write-Host "Application  : ${{ inputs.appname }}"
          Write-Host "Filename     : ${{ inputs.filename }}"
          Write-Host "Architecture : x64"
          Write-Host "Flutter      : ${{ env.FLUTTER_VERSION }}"
          Write-Host "VCPKG        : ${{ env.VCPKG_COMMIT_ID }}"

          Write-Host "=============================================="
