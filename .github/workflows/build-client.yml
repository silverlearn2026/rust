name: Build Custom RustDesk Windows Client

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        default: "master"
      server:
        required: false
        type: string
        default: ""
      key:
        required: false
        type: string
        default: ""
      apiServer:
        required: false
        type: string
        default: ""
      custom:
        required: false
        type: string
        default: ""
      uuid:
        required: false
        type: string
        default: ""
      iconlink:
        required: false
        type: string
        default: ""
      logolink:
        required: false
        type: string
        default: ""
      appname:
        required: false
        type: string
        default: "RustDesk"
      filename:
        required: false
        type: string
        default: "RustDesk.exe"
      extras:
        description: "Complete Laravel appearance/client JSON"
        required: false
        type: string
        default: ""
      upload_artifact:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_TRIPLET: "x64-windows-static"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  FRB_VERSION: "1.80.1"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ inputs.version }}
          path: rustdesk
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustdesk

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: pwsh
        working-directory: rustdesk
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ env.VCPKG_TRIPLET }}
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet "${{ env.VCPKG_TRIPLET }}" --x-install-root="$env:VCPKG_ROOT\installed"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Apply Laravel configuration
        shell: pwsh
        working-directory: rustdesk
        env:
          SERVER: ${{ inputs.server }}
          KEY: ${{ inputs.key }}
          API: ${{ inputs.apiServer }}
          APP: ${{ inputs.appname }}
          FILE: ${{ inputs.filename }}
          EXTRAS: ${{ inputs.extras }}
        run: |
          $script="..\scripts\apply_config.py"
          if(-not(Test-Path $script)){throw "apply_config.py not found."}
          $a=@("--rustdesk","$PWD")
          if($env:SERVER){$a+=@("--server",$env:SERVER)}
          if($env:KEY){$a+=@("--key",$env:KEY)}
          if($env:API){$a+=@("--api",$env:API)}
          if($env:APP){$a+=@("--appname",$env:APP)}
          if($env:FILE){$a+=@("--filename",$env:FILE)}
          if($env:EXTRAS){$a+=@("--extras",$env:EXTRAS)}
          python $script @a
          if($LASTEXITCODE -ne 0){throw "Configuration patch failed."}

      - name: Verify generated configuration
        shell: pwsh
        working-directory: rustdesk
        run: |
          if(-not(Test-Path ".\flutter\lib\generated_client_config.dart")){throw "generated_client_config.dart missing."}
          if(-not(Test-Path ".\res\custom-client-config.json")){throw "custom-client-config.json missing."}
          Get-Content ".\flutter\lib\generated_client_config.dart"

      - name: Flutter dependencies
        shell: pwsh
        working-directory: rustdesk\flutter
        run: |
          flutter clean
          flutter pub get
          if($LASTEXITCODE -ne 0){throw "flutter pub get failed."}

      - name: Install FRB
        shell: pwsh
        working-directory: rustdesk
        run: |
          cargo install flutter_rust_bridge_codegen --version "${{ env.FRB_VERSION }}" --locked
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Generate FRB
        shell: pwsh
        working-directory: rustdesk
        run: |
          $c="$env:USERPROFILE\.cargo\bin\flutter_rust_bridge_codegen.exe"
          if(-not(Test-Path $c)){throw "FRB codegen missing."}
          & $c --rust-input ".\src\flutter_ffi.rs" --dart-output ".\flutter\lib\generated_bridge.dart" --c-output ".\flutter\macos\Runner\bridge_generated.h"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Verify FRB
        shell: pwsh
        working-directory: rustdesk
        run: |
          foreach($f in @(".\src\bridge_generated.rs",".\src\bridge_generated.io.rs",".\flutter\lib\generated_bridge.dart")){
            if(-not(Test-Path $f)){throw "Missing: $f"}
          }

      - name: Build RustDesk runtime
        shell: pwsh
        working-directory: rustdesk
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
          VCPKG_DEFAULT_TRIPLET: ${{ env.VCPKG_TRIPLET }}
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}
        run: |
          python build.py --portable --flutter --skip-portable-pack --hwcodec
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Verify Windows runtime
        shell: pwsh
        working-directory: rustdesk
        run: |
          $d=Join-Path $PWD "flutter\build\windows\x64\runner\Release"
          if(-not(Test-Path (Join-Path $d "rustdesk.exe"))){throw "rustdesk.exe missing."}
          foreach($f in @("flutter_windows.dll","desktop_multi_window_plugin.dll")){
            if(-not(Test-Path (Join-Path $d $f))){throw "$f missing."}
          }
          if(-not(Test-Path (Join-Path $d "data"))){throw "Flutter data missing."}

      - name: Build single-file EXE
        shell: pwsh
        working-directory: rustdesk
        env:
          OUTPUT: ${{ inputs.filename }}
        run: |
          $p=Join-Path $PWD "libs\portable"
          $packer=Join-Path $PWD "target\release\rustdesk-portable-packer.exe"
          if(Test-Path $packer){Remove-Item $packer -Force}
          Push-Location $p
          try{
            python -m pip install -r requirements.txt
            if($LASTEXITCODE -ne 0){throw "portable dependencies failed."}
            python .\generate.py -f "../../flutter/build/windows/x64/runner/Release" -o "." -e "../../flutter/build/windows/x64/runner/Release/rustdesk.exe"
            if($LASTEXITCODE -ne 0){throw "portable packer failed."}
          }finally{Pop-Location}
          if(-not(Test-Path $packer)){throw "portable EXE was not created."}
          $name=$env:OUTPUT
          if(-not $name){$name="RustDesk.exe"}
          if(-not $name.EndsWith(".exe",[StringComparison]::OrdinalIgnoreCase)){$name+=".exe"}
          $r=Join-Path $PWD "Release"
          if(Test-Path $r){Remove-Item $r -Recurse -Force}
          New-Item -ItemType Directory -Force -Path $r|Out-Null
          Copy-Item $packer (Join-Path $r $name) -Force
          if(-not(Test-Path (Join-Path $r $name))){throw "Final EXE missing."}

      - name: Upload Windows client
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64-${{ github.run_number }}
          path: rustdesk/Release/*.exe
          if-no-files-found: error
          retention-days: 7
